name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore

      - name: Analyze
        run: dotnet build --no-restore --configuration Release -p:TreatWarningsAsErrors=true

      - name: Test
        run: >
          dotnet test --no-build --configuration Release
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Generate coverage report
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          reportgenerator "-reports:tests/**/TestResults/**/coverage.cobertura.xml" "-targetdir:coveragereport" "-reporttypes:TextSummary" "-classfilters:+*;-Training.Training.Proto.*;-Training.AI.Proto.*;-Training.Auth.*"

      - name: Show coverage
        run: cat coveragereport/Summary.txt

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-gateway
          path: coveragereport/
